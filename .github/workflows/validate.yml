name: Validate app and push worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install push worker dependencies
        working-directory: push-server
        run: npm install --no-audit --no-fund
      - name: Bundle push worker with Wrangler
        working-directory: push-server
        run: npx wrangler deploy --dry-run
      - name: Check JavaScript syntax and JSON
        run: |
          node --check sw.js
          node --check push-config.js
          node --check push-server/src/index.js
          node --check push-server/generate-vapid.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Inline app script not found');
          const file = '/tmp/inline-app.js';
          fs.writeFileSync(file, html.slice(start + 8, end));
          const result = spawnSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          if (result.status !== 0) process.exit(result.status ?? 1);
          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          JSON.parse(fs.readFileSync('push-server/package.json', 'utf8'));
          const workerConfig = fs.readFileSync('push-server/wrangler.toml', 'utf8');
          const origins = workerConfig.match(/^ALLOWED_ORIGINS\s*=\s*"([^"]+)"/m)?.[1]?.split(',').map(x => x.trim()) ?? [];
          for (const origin of ['https://trevoga-ua.onrender.com', 'https://dxd89293-ux.github.io']) {
            if (!origins.includes(origin)) throw new Error('Missing allowed push origin: ' + origin);
          }
          if (!html.includes("window.TREVOGA_PUSH_API")) throw new Error('Push API config not referenced by app');
          if (!html.includes("Данные NEPTUN устарели более чем на 3 минуты")) throw new Error('Stale NEPTUN threat cleanup is missing');
          if (!html.includes("now-neptunLastRetryAt>60000") || !html.includes("neptunRealtimeClient.retry()")) throw new Error('NEPTUN stream recovery watchdog is missing');
          if (!html.includes("t.advisory===true")) throw new Error('NEPTUN advisory handling is missing');
          if (!html.includes("t.areaOnly!==true")) throw new Error('Area-only NEPTUN records must not become point markers');
          const sw = fs.readFileSync('sw.js', 'utf8');
          if (!sw.includes("self.addEventListener('push'")) throw new Error('Service Worker push handler is missing');
          if (!sw.includes("self.addEventListener('notificationclick'")) throw new Error('Notification click handler is missing');
          const worker = fs.readFileSync('push-server/src/index.js', 'utf8');
          if (!worker.includes('allowedOrigins.includes(origin)')) throw new Error('Worker origin allowlist check is missing');
          if (!worker.includes('sourceAgeMs + cacheAgeMs < 180000')) throw new Error('Worker NEPTUN freshness guard is missing');
          if (!worker.includes('_fetchedAt: Date.now()') || !worker.includes('_httpDate: Number.isFinite(dateHeader) ? dateHeader : null')) throw new Error('Worker must evaluate NEPTUN HTTP freshness metadata');
          if (!worker.includes('JSON.stringify({ subscription: sub, regions, vibration })')) throw new Error('Worker must persist the per-device vibration preference');
          if (!html.includes('const known=(!!n&&statusSupported)||threatActive')) throw new Error('NEPTUN alerts or fresh threat stream must be the primary client alert source');
          if (!html.includes('const active=n?(nActive||threatActive):tActive')) throw new Error('Fresh NEPTUN threat records must activate regional status');
          if (!worker.includes('states[slug] = nFull || nPart;')) throw new Error('NEPTUN is not the primary push alert source');
          if (!worker.includes('results[0].status === "fulfilled"')) throw new Error('Primary NEPTUN push state must not depend on auxiliary feed availability');
          if (!worker.includes('vibration: typeof savedVibration === "boolean" ? savedVibration : true')) throw new Error('Per-device push vibration preference is not retained');
          if (!worker.includes('vibrate: item.vibration ? payload.vibrate : []')) throw new Error('Per-device push vibration preference is not applied');
          if (!worker.includes('NEPTUN сообщил о тревоге')) throw new Error('Background push alert source attribution is incorrect');
          if (!html.includes('vibration:vibrationEnabled')) throw new Error('App vibration setting is not synced to push server');
          if (!html.includes('цвет угрозы определяется типом из потока NEPTUN') && !html.includes('Баллистическая угроза')) throw new Error('NEPTUN threat color source is not disclosed');
          if (worker.includes('results.every(x => x.status === "fulfilled")')) throw new Error('Auxiliary source failure must not block NEPTUN push alerts');
          if (!html.includes('нейтральным серым цветом как неподтверждённые')) throw new Error('Unconfirmed alert state must be clearly neutral and unconfirmed');
          if (worker.includes('tryvohaFresh')) throw new Error('Auxiliary Tryvoha freshness must not block primary push state');
          if (!html.includes('const confirmedStates=new Map()')) throw new Error('Confirmed alert state memory is missing');
          if (!html.includes("s.known&&s.level==='red'?'#ed343b'") || !html.includes("s.known&&s.level==='yellow'?'#e8bd35'") || html.includes("#e58a32")) throw new Error('Ballistic red, UAV yellow, or neutral unknown colors are incorrect');
          if (!html.includes("String(t.type||'').toLowerCase()==='ballistic'")) throw new Error('Ballistic threats must always be red');
          if (!html.includes("String(t.type||'').toLowerCase()==='uav'")) throw new Error('UAV/Shahed threats must be yellow');
          if (!html.includes("neptunThreatRecords=freshActive.filter(t=>t.advisory!==true)")) throw new Error('Regional threat colors must not depend on UI filters or advisory observations');
          if (!worker.includes('https://neptun.in.ua/api/v1/threats')) throw new Error('Background worker must check the NEPTUN threat feed');
          if (!worker.includes('item.advisory === true')) throw new Error('Background threat notifications must exclude advisory observations');
          if (!worker.includes('item.type !== "ballistic" && item.type !== "uav"')) throw new Error('Background threat notifications must classify ballistic and UAV signals only');
          if (!worker.includes('kind: "threat"') || !worker.includes('threat:seen')) throw new Error('Background threat notifications must deduplicate active threat IDs');
          if (!worker.includes('const hasThreatBaseline = savedSeen !== null') || !worker.includes('if (!hasThreatBaseline) continue;')) throw new Error('First background threat snapshot must initialize silently');
          if (!worker.includes('item.type === "ballistic" ? "Угроза баллистики · NEPTUN"')) throw new Error('Background threat notification titles must identify ballistic threats');
          if (!worker.includes('function regionSlugFor(value)')) throw new Error('Background threat notifications must respect selected region subscriptions');
          if (!worker.includes('Unknown/conflicting data must not erase the last confirmed state.')) throw new Error('Worker confirmed baseline retention is missing');
          if (!worker.includes('vibrate: isThreat || item.active ? [300, 150, 300] : [120, 80, 120]')) throw new Error('Push vibration patterns are missing');
          if (!sw.includes('vibrate:Array.isArray(data.vibrate)')) throw new Error('Background push vibration handler is missing');
          if (!html.includes('freshNeptun=value=>')) throw new Error('Client NEPTUN freshness must not require a JSON timestamp');
          if (!html.includes('_httpDate:Number.isFinite(dateHeader)?dateHeader:null') || !html.includes('_cacheAgeMs:Number.isFinite(ageSeconds)')) throw new Error('Client must evaluate HTTP Date/Age freshness metadata');
          if (!html.includes('age+cacheAge<180000')) throw new Error('Client NEPTUN cache-aware freshness guard is missing');
          console.log('Syntax, JSON, CORS, freshness, threat safety and push handler checks passed.');
          NODE
