name: Validate app and push worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax and JSON
        run: |
          node --check sw.js
          node --check push-config.js
          node --check push-server/src/index.js
          node --check push-server/generate-vapid.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw new Error('No inline app script found');
          scripts.forEach((match, i) => {
            const file = `/tmp/inline-${i}.js`;
            fs.writeFileSync(file, match[1]);
            const result = spawnSync(process.execPath, ['--check', file], { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status ?? 1);
          });
          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          JSON.parse(fs.readFileSync('push-server/package.json', 'utf8'));
          console.log('JavaScript syntax and JSON checks passed.');
          NODE
